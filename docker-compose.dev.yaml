# Ambiente di sviluppo.
#
# Il container `postgres` e' un add-on opzionale, dietro il profilo `localdb`.
# L'interruttore e' DB_MODE nell'env file:
#
#   DB_MODE=local     (default) il database gira qui, nel profilo `localdb`
#   DB_MODE=external  ci si collega al PostgreSQL indicato da DB_HOST
#
# Il Makefile traduce DB_MODE in COMPOSE_PROFILES e DB_HOST; lanciando
# `docker compose` a mano, in locale, serve `--profile localdb`.
#
# In modalita' external il database deve chiamarsi `euonqol`, perche'
# `init.sql` contiene un `\c euonqol;` in testa. Gli schemi invece non vanno
# creati a mano: ci pensa il servizio `db-schemas`.
#
# Avvio: vedi `make help`.

services:
  postgres:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${DB_NAME:-euonqol}
      POSTGRES_USER: ${DB_USER:-euonqol_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-euonqol_password}
      # Porta su cui Postgres ascolta anche dentro la rete docker: gli altri
      # servizi si collegano a ${DB_HOST}:${DB_PORT}, quindi deve coincidere.
      PGPORT: ${DB_PORT:-5432}
      TZ: UTC
      PGTZ: UTC
    command: postgres -c timezone=UTC -c hba_file=/var/lib/postgresql/custom-pg_hba.conf
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./setup/db/pg_hba.conf:/var/lib/postgresql/custom-pg_hba.conf:ro
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    networks:
      - app-network
    healthcheck:
      # `-h 127.0.0.1` e' essenziale. Al primo avvio l'entrypoint dell'immagine
      # fa girare l'inizializzazione su un server temporaneo che ascolta solo
      # sul socket Unix, poi lo spegne e avvia quello definitivo: un pg_isready
      # sul socket risponde "pronto" gia' durante quella fase, e i servizi in
      # attesa partono contro un server che sulla rete non c'e' ancora.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${DB_USER:-euonqol_user} -d ${DB_NAME:-euonqol}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-schemas:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}-db-schemas
    # Keycloak crea le proprie tabelle via Liquibase ma NON lo schema che le
    # contiene: se manca esce con `schema "..." does not exist` e, con
    # restart: unless-stopped, entra in un crash loop silenzioso. Questo
    # servizio crea gli schemi sia sul postgres in container sia su un database
    # esterno, prima di Keycloak, ed e' idempotente.
    #
    # La dipendenza da postgres e' `required: false` (in modalita' external il
    # servizio non esiste), quindi se postgres non parte Compose emette solo un
    # warning e avvia comunque questo container. Per questo si attende il
    # database qui, con un limite e un messaggio chiaro, invece di lasciare
    # che psql esca con un generico exit 2.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - app-network
    environment:
      PGPASSWORD: ${DB_PASSWORD:-euonqol_password}
      PGSSLMODE: ${DB_SSLMODE:-disable}
    entrypoint:
      - /bin/sh
      - -c
      - |
        WAITED=0
        until pg_isready -q -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "${DB_USER:-euonqol_user}" -d "${DB_NAME:-euonqol}"; do
          if [ "$$WAITED" -ge 120 ]; then
            echo "ERRORE: database ${DB_HOST:-postgres}:${DB_PORT:-5432} non raggiungibile dopo 120s."
            echo "        Con DB_MODE=local: docker logs ${COMPOSE_PROJECT_NAME}-postgres"
            exit 1
          fi
          sleep 2
          WAITED=$$((WAITED + 2))
        done
        exec psql -v ON_ERROR_STOP=1 -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "${DB_USER:-euonqol_user}" -d "${DB_NAME:-euonqol}" \
          -c 'CREATE SCHEMA IF NOT EXISTS "${KEYCLOAK_DB_SCHEMA:-public}";' \
          -c 'CREATE SCHEMA IF NOT EXISTS euonqol;'
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-euonqol}?sslmode=${DB_SSLMODE:-disable}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      KC_DB_USERNAME: ${DB_USER:-euonqol_user}
      KC_DB_PASSWORD: ${DB_PASSWORD:-euonqol_password}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        # Senza `required: false`, con il profilo `localdb` spento Compose
        # rifiuta l'intero file con "depends on undefined service".
        required: false
      db-schemas:
        condition: service_completed_successfully
    command: start-dev
    networks:
      - app-network
    # In modalita' external non c'e' un healthcheck su cui attendere: Keycloak
    # esce se il database non risponde al boot, il restart e' la rete di sicurezza.
    restart: unless-stopped

  keycloak-setup:
    image: curlimages/curl:latest
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak-setup
    profiles: ["init"]
    depends_on:
      - keycloak
    volumes:
      - ./setup/keycloak/init-keycloak.sh:/scripts/init.sh
    networks:
      - app-network
    environment:
      # Keycloak Configuration
      KEYCLOAK_URL: http://keycloak:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_URL_PUBLIC: ${KEYCLOAK_URL_PUBLIC:-http://localhost:${KEYCLOAK_PORT:-8080}}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Realm Configuration
      REALM_ID: cc2ec4d2-c6f0-4296-90e7-d0be1de23390
      REALM_NAME: euonqol
      FRONTEND_CLIENT_ID: euonqol-frontend
      BACKEND_CLIENT_ID: euonqol-backend
      BACKEND_CLIENT_SECRET: HE9evcw5s5xoDestvoCMdZKCk+8asQOe

      # Test User Configuration
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME}
      ADMIN_TYPE: ${ADMIN_TYPE}
      ADMIN_IS_ACTIVE: ${ADMIN_IS_ACTIVE}

      # Mail Configuration
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@euonqol.com}
      EMAIL_FROM_DISPLAY_NAME: ${EMAIL_FROM_DISPLAY_NAME:-EUONQOL}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    # init-keycloak.sh aspetta Keycloak per un massimo di 30s + 30x5s = 3 minuti.
    # Su un database esterno non bastano: il bootstrap Liquibase fa centinaia di
    # DDL, ognuno con un round trip di rete, e al primo avvio puo' superare i 5
    # minuti. Qui si attende senza limite di tentativi prima di cedere il
    # controllo allo script. Con il database in locale passa al primo giro.
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "In attesa di Keycloak..."
        WAITED=0
        until curl -sf -o /dev/null "http://keycloak:${KEYCLOAK_PORT:-8080}/realms/master"; do
          sleep 5
          WAITED=$$((WAITED + 5))
          echo "  ...ancora in bootstrap ($${WAITED}s). Avanzamento: docker logs -f ${COMPOSE_PROJECT_NAME}-keycloak"
        done
        echo "Keycloak raggiungibile, avvio init-keycloak.sh"
        exec /bin/sh /scripts/init.sh
    restart: "no"

  db-init:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}-db-init
    profiles: ["init"]
    # init.sql crea foreign key verso ${KEYCLOAK_DB_SCHEMA}.user_entity: le
    # tabelle di Keycloak devono esistere prima, quindi si aspetta keycloak-setup.
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
    volumes:
      - ./setup/db/init.sql:/scripts/init.sql
    networks:
      - app-network
    environment:
      PGPASSWORD: ${DB_PASSWORD:-euonqol_password}
      PGSSLMODE: ${DB_SSLMODE:-disable}
    command: psql -h ${DB_HOST:-postgres} -p ${DB_PORT:-5432} -U ${DB_USER:-euonqol_user} -d ${DB_NAME:-euonqol} -v keycloak_schema=${KEYCLOAK_DB_SCHEMA:-public} -f /scripts/init.sql
    restart: "no"

  backend:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    environment:
      # Application
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}

      # Database URLs.
      #
      # DB_SSLMODE vale `disable` di default, perche' il postgres in
      # container non espone TLS. Per un database esterno che lo richiede va
      # messo `prefer` o `require` nell'env file.
      #
      # `uselibpqcompat=true`: dalla 8.16 il driver `pg` tratta
      # sslmode=prefer/require come verify-full e fallisce sui certificati
      # self-signed, mentre Prisma segue la semantica libpq. Senza il flag il
      # server parte ma scripts/migrate.ts non si connette. Attenzione: sotto
      # questo flag `prefer` NON ricade su plaintext quando il server e' senza
      # TLS, quindi in locale serve davvero `disable`.
      KEYCLOAK_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      KEYCLOAK_DATABASE_URL: postgresql://${DB_USER:-euonqol_user}:${DB_PASSWORD:-euonqol_password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-euonqol}?schema=${KEYCLOAK_DB_SCHEMA:-public}&uselibpqcompat=true&sslmode=${DB_SSLMODE:-disable}
      APP_DATABASE_URL: postgresql://${DB_USER:-euonqol_user}:${DB_PASSWORD:-euonqol_password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-euonqol}?schema=euonqol&uselibpqcompat=true&sslmode=${DB_SSLMODE:-disable}

      # Database Connection (usata dal Pool `pg` in src/config/database.ts)
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-euonqol}
      DB_USER: ${DB_USER:-euonqol_user}
      DB_PASSWORD: ${DB_PASSWORD:-euonqol_password}

      # Keycloak
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: euonqol
      KEYCLOAK_CLIENT_ID: euonqol-backend
      KEYCLOAK_CLIENT_SECRET: HE9evcw5s5xoDestvoCMdZKCk+8asQOe
      KEYCLOAK_REALM_ID: cc2ec4d2-c6f0-4296-90e7-d0be1de23390
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Email Configuration
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_FROM: noreply@euonqol.eu
      EMAIL_SECURE: false

      # Security
      ENCRYPTION_KEY: 63129faea0205e9c42154c23c15af0dd386f3cdbc4a3b2ee2e89bfcd28e75db8

      # CAT (Computer Adaptive Testing)
      CAT_API_URL: ${CAT_API_URL}
      CAT_API_KEY: ${CAT_API_KEY}

      # Scheduler (disabled by default; set ENABLE_SCHEDULER=true in .env.dev to enable)
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    command: sh -c "npm install && npx prisma generate --schema=prisma/app/schema.prisma && npx prisma generate --schema=prisma/keycloak/schema.prisma && npm run dev"
    restart: unless-stopped

  mailpit:
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    image: axllent/mailpit:latest
    ports:
      - "${EMAIL_PORT:-1025}:1025"
      - "${EMAIL_UI_PORT:-8025}:8025"
    networks:
      - app-network

volumes:
  postgres-test-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
  backend-node-modules:
    name: ${COMPOSE_PROJECT_NAME}-backend-node-modules

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME}-network
    driver: bridge
