# Server HTTPS. Copiato in /etc/nginx/https.conf, fuori da conf.d/: lo attiva
# 30-https.sh, copiandolo in conf.d/, solo con FRONTEND_TLS=on.
#
# Certificato e chiave arrivano dalla VM: `make web-certs` copia
# FRONTEND_TLS_CERT e FRONTEND_TLS_KEY in .certs/<ENV>-web, montata qui su
# /etc/nginx/tls. Il certificato deve contenere anche gli intermedi (fullchain).
#
# Niente HSTS: una volta ricevuto, il browser rifiuterebbe l'HTTP per mesi, anche
# se FRONTEND_TLS tornasse a off. Va aggiunto quando l'HTTPS e' definitivo.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/app.conf;
}
