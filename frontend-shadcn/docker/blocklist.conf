# Blocco dei pattern usati dagli scanner automatici.
# Questo file viene incluso DENTRO il blocco server{} di nginx.conf: contiene solo
# location, quindi NON va copiato in conf.d/ (lì finirebbe nel contesto http e nginx
# non partirebbe).
#
# Le location con regex hanno precedenza su quelle prefix: per questo intercettano
# /vendor/phpunit/... prima della location /api/ qui sotto.

# Dotfile e directory nascoste: .env, .env.local, .env.bak, .git/, .svn/, .aws/, .ssh/…
# Eccezione .well-known: serve alla validazione ACME quando ci sarà un dominio.
location ~ /\.(?!well-known) {
    return 403;
}

# Scanner PHP/Laravel: /vendor/phpunit/... eval-stdin.php, _ignition (RCE Laravel), profiler
location ~* /(vendor|phpunit|_ignition|_profiler)/ {
    return 403;
}

# WordPress
location ~* /(wp-login|wp-admin|wp-content|wp-includes|xmlrpc\.php) {
    return 403;
}

# Pannelli admin di stack che non usiamo
location ~* /(phpmyadmin|pma|myadmin|adminer|solr|actuator|cgi-bin)/ {
    return 403;
}

# Estensioni di stack che non usiamo: l'app è React (statico) + Node.
# I download .xlsx/.csv esposti dal backend passano da /euonqol-api/... e non sono toccati.
location ~* \.(php|php5|phtml|asp|aspx|jsp|cgi|pl|sh|bak|old|swp)$ {
    return 403;
}

# Vecchio prefix API (ora /euonqol-api, vedi backend/src/server.ts): richieste a
# /api/* sono probing/bot residuo su path defunto, non rotte legittime.
location /api/ {
    return 403;
}
