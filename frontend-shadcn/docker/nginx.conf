# Questo file viene copiato in /etc/nginx/conf.d/default.conf: il livello esterno è

# Rate limiting per IP client
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# User-agent di scanner noti
map $http_user_agent $blocked_agent {
    default   0;
    ""        1;      # UA vuoto: quasi sempre bot
    ~*sqlmap  1;
    ~*nikto   1;
    ~*nmap    1;
    ~*masscan 1;
    ~*zgrab   1;
    ~*nuclei  1;
    ~*fuzz    1;
}

# Data corrente per il nome del file di log giornaliero (YYYY-MM-DD, ora UTC del container).
# Le virgolette attorno al regex sono obbligatorie: senza, nginx interpreterebbe le graffe
# di \d{4} come delimitatori di blocco.
map $time_iso8601 $log_date {
    "~^(?<ymd>\d{4}-\d{2}-\d{2})" $ymd;
    default                       "unknown";
}

# Logga solo ciò che respinge nginx: 403 (blocklist + user-agent) e 405 (metodo non ammesso).
# $upstream_addr vuoto = backend non contattato, così i 403 legittimi restituiti dal backend
# (dinieghi di permesso) restano fuori dal file.
map "$status:$upstream_addr" $is_blocked {
    "~^(403|405):$" 1;
    default         0;
}

log_format blocked '$time_iso8601 ip=$remote_addr status=$status method=$request_method '
                   'uri="$request_uri" host=$host ua="$http_user_agent" ref="$http_referer"';

# Il path del log contiene una variabile: senza questa cache nginx riaprirebbe il file
# a ogni richiesta
open_log_file_cache max=32 inactive=2m valid=1m min_uses=1;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;          # non esporre la versione di nginx
    client_max_body_size 10m;   # allineato al limite di express.json nel backend

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Log dedicato dei tentativi bloccati, un file al giorno, retention 7 giorni
    # (vedi docker/log-cleanup.crontab). Nei giorni senza blocchi il file non viene creato.
    access_log /var/log/nginx/blocked/blocked-$log_date.log blocked if=$is_blocked;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json
        image/svg+xml;

    # Blocco pattern usati dagli scanner (.env, /vendor/phpunit/, wp-admin, *.php…)
    include /etc/nginx/blocklist.conf;

    if ($blocked_agent) {
        return 403;
    }

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Rate limit generale: alto perché il primo caricamento della SPA scarica
    # decine di asset in burst
    limit_req  zone=general burst=60 nodelay;
    limit_conn perip 30;
    limit_req_status  429;
    limit_conn_status 429;

    # PROXY per le API → Backend
    location /euonqol-api/ {
        # Rate limit più stretto sulle API (sostituisce quello ereditato dal server)
        limit_req zone=api burst=20 nodelay;

        # Risolvi DNS dinamicamente
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:3000;

        proxy_pass $backend;
        proxy_http_version 1.1;

        # Headers necessari
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (se necessario)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing - file statici e route React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache per assets con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Non cachare index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
