# Questo file viene copiato in /etc/nginx/conf.d/default.conf: il livello esterno è

# Rate limiting per IP client
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# User-agent di scanner noti
map $http_user_agent $blocked_agent {
    default   0;
    ""        1;      # UA vuoto: quasi sempre bot
    ~*sqlmap  1;
    ~*nikto   1;
    ~*nmap    1;
    ~*masscan 1;
    ~*zgrab   1;
    ~*nuclei  1;
    ~*fuzz    1;
}

# Data corrente per il nome del file di log giornaliero (YYYY-MM-DD, ora UTC del container).
# Le virgolette attorno al regex sono obbligatorie: senza, nginx interpreterebbe le graffe
# di \d{4} come delimitatori di blocco.
map $time_iso8601 $log_date {
    "~^(?<ymd>\d{4}-\d{2}-\d{2})" $ymd;
    default                       "unknown";
}

# Logga solo ciò che respinge nginx: 403 (blocklist + user-agent) e 405 (metodo non ammesso).
# $upstream_addr vuoto = backend non contattato, così i 403 legittimi restituiti dal backend
# (dinieghi di permesso) restano fuori dal file.
map "$status:$upstream_addr" $is_blocked {
    "~^(403|405):$" 1;
    default         0;
}

log_format blocked '$time_iso8601 ip=$remote_addr status=$status method=$request_method '
                   'uri="$request_uri" host=$host ua="$http_user_agent" ref="$http_referer"';

# Il path del log contiene una variabile: senza questa cache nginx riaprirebbe il file
# a ogni richiesta
open_log_file_cache max=32 inactive=2m valid=1m min_uses=1;

server {
    listen 80;
    server_name _;

    # Con FRONTEND_TLS=on 30-https.sh crea questo file, che rimanda su HTTPS. Spento
    # il file non esiste e il glob non trova nulla: la porta 80 serve l'app come prima.
    include /etc/nginx/https-redirect[.]conf;

    include /etc/nginx/app.conf;
}
