# Corpo del server, incluso sia dal server sulla porta 80 (nginx.conf) sia da
# quello sulla 443 (https.conf), cosi' HTTP e HTTPS servono la stessa
# configurazione. Copiato in /etc/nginx/app.conf: fuori da conf.d/, dove nginx
# lo caricherebbe da solo a livello http.

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;          # non esporre la versione di nginx
    client_max_body_size 10m;   # allineato al limite di express.json nel backend

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Log dedicato dei tentativi bloccati, un file al giorno, retention 7 giorni
    # (vedi docker/log-cleanup.crontab). Nei giorni senza blocchi il file non viene creato.
    access_log /var/log/nginx/blocked/blocked-$log_date.log blocked if=$is_blocked;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json
        image/svg+xml;

    # Blocco pattern usati dagli scanner (.env, /vendor/phpunit/, wp-admin, *.php…)
    include /etc/nginx/blocklist.conf;

    if ($blocked_agent) {
        return 403;
    }

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Rate limit generale: alto perché il primo caricamento della SPA scarica
    # decine di asset in burst
    limit_req  zone=general burst=60 nodelay;
    limit_conn perip 30;
    limit_req_status  429;
    limit_conn_status 429;

    # PROXY per le API → Backend
    location /euonqol-api/ {
        # Rate limit più stretto sulle API (sostituisce quello ereditato dal server)
        limit_req zone=api burst=20 nodelay;

        # Risolvi DNS dinamicamente
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:3000;

        proxy_pass $backend;
        proxy_http_version 1.1;

        # Headers necessari
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (se necessario)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing - file statici e route React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache per assets con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Non cachare index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
