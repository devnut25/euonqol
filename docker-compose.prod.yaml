# Ambiente di produzione.
#
# Il container `postgres` e' un add-on opzionale dietro il profilo `localdb`,
# governato da DB_MODE nell'env file (local = default, external = DB esterno
# indicato da DB_HOST). Vedi l'intestazione di docker-compose.dev.yaml e
# `make help`.

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15}
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${DB_NAME:-euonqol}
      POSTGRES_USER: ${DB_USER:-euonqol_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      # Porta su cui Postgres ascolta anche dentro la rete docker: gli altri
      # servizi si collegano a ${DB_HOST}:${DB_PORT}, quindi deve coincidere.
      PGPORT: ${DB_PORT:-5432}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    networks:
      - app-network
    healthcheck:
      # `-h 127.0.0.1` e' essenziale. Al primo avvio l'entrypoint dell'immagine
      # fa girare l'inizializzazione su un server temporaneo che ascolta solo
      # sul socket Unix, poi lo spegne e avvia quello definitivo: un pg_isready
      # sul socket risponde "pronto" gia' durante quella fase, e i servizi in
      # attesa partono contro un server che sulla rete non c'e' ancora.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${DB_USER:-euonqol_user} -d ${DB_NAME:-euonqol}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-schemas:
    image: postgres:${POSTGRES_VERSION:-15}
    container_name: ${COMPOSE_PROJECT_NAME}-db-schemas
    # Keycloak crea le proprie tabelle via Liquibase ma NON lo schema che le
    # contiene: se manca esce con `schema "..." does not exist` e, con
    # restart: unless-stopped, entra in un crash loop silenzioso. Questo
    # servizio crea gli schemi sia sul postgres in container sia su un database
    # esterno, prima di Keycloak, ed e' idempotente.
    #
    # La dipendenza da postgres e' `required: false` (in modalita' external il
    # servizio non esiste), quindi se postgres non parte Compose emette solo un
    # warning e avvia comunque questo container. Per questo si attende il
    # database qui, con un limite e un messaggio chiaro, invece di lasciare
    # che psql esca con un generico exit 2.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - app-network
    # Il nome del database esterno puo' esistere solo nell'/etc/hosts della
    # macchina, che i container non ereditano: con DB_HOST_IP nell'env file il
    # Makefile lo passa qui come DB_HOSTS_ENTRY (DB_HOST:DB_HOST_IP), cosi' il
    # nome resta quello del certificato e sslmode=verify-full continua a
    # funzionare. Vuoto, la voce di ripiego e' innocua: host.docker.internal
    # punta alla macchina Docker, come gia' fa Docker Desktop.
    extra_hosts:
      - "${DB_HOSTS_ENTRY:-host.docker.internal:host-gateway}"
    volumes:
      - ${DB_CERTS_DIR:-./.certs}:/certs:ro
    environment:
      PGPASSWORD: ${DB_PASSWORD:?}
      PGSSLMODE: ${DB_SSLMODE:-disable}
      PGSSLROOTCERT: ${DB_SSLROOTCERT:+/certs/root.crt}
      PGSSLCERT: ${DB_SSLCERT:+/certs/client.crt}
      PGSSLKEY: ${DB_SSLKEY:+/certs/client.key}
    entrypoint:
      - /bin/sh
      - -c
      - |
        WAITED=0
        until pg_isready -q -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "${DB_USER:-euonqol_user}" -d "${DB_NAME:-euonqol}"; do
          if [ "$$WAITED" -ge 120 ]; then
            echo "ERRORE: database ${DB_HOST:-postgres}:${DB_PORT:-5432} non raggiungibile dopo 120s."
            echo "        Con DB_MODE=local: docker logs ${COMPOSE_PROJECT_NAME}-postgres"
            exit 1
          fi
          sleep 2
          WAITED=$$((WAITED + 2))
        done
        exec psql -v ON_ERROR_STOP=1 -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "${DB_USER:-euonqol_user}" -d "${DB_NAME:-euonqol}" \
          -c 'CREATE SCHEMA IF NOT EXISTS "${KEYCLOAK_DB_SCHEMA:-public}";' \
          -c 'CREATE SCHEMA IF NOT EXISTS euonqol;'
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-euonqol}?sslmode=${DB_SSLMODE:-disable}${DB_SSLROOTCERT:+&sslrootcert=/certs/root.crt}${DB_SSLCERT:+&sslcert=/certs/client.crt&sslkey=/tmp/client.pk8}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-${DB_USER:-euonqol_user}}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-${DB_PASSWORD:?}}
      KC_DB_POOL_MAX_SIZE: ${KC_DB_POOL_MAX_SIZE:-20}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      # Un solo nodo: cache in memoria, come con start-dev. Senza, `start` avvia
      # la cache distribuita Infinispan, che cerca gli altri nodi tramite una
      # tabella sul database.
      KC_CACHE: local
    volumes:
      - ${DB_CERTS_DIR:-./.certs}:/certs:ro
    ports:
      # Solo su 127.0.0.1: il backend usa Keycloak dalla rete docker e il
      # browser non lo chiama mai, quindi da fuori serve solo la console admin,
      # che si apre con un tunnel SSH (vedi readMe). KEYCLOAK_BIND=0.0.0.0
      # nell'env file la riapre a tutti, come prima.
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
        # Senza `required: false`, con il profilo `localdb` spento Compose
        # rifiuta l'intero file con "depends on undefined service".
        required: false
      db-schemas:
        condition: service_completed_successfully
    # pgjdbc, come libpq, rifiuta una chiave client leggibile da altri: la
    # vuole 0600 e di proprieta' dell'utente di Keycloak (uid 1000), che non e'
    # chi ha lanciato `make db-certs`. La si copia quindi in /tmp, dove e' sua.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /certs/client.pk8 ]; then
          cp /certs/client.pk8 /tmp/client.pk8 && chmod 600 /tmp/client.pk8 || exit 1
        fi
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc.sh
    # Modalita' produzione: temi in cache e niente impostazioni da sviluppo.
    # Senza --optimized ricompone la configurazione a ogni avvio, qualche
    # decina di secondi in piu'.
    command: start
    networks:
      - app-network
    # Nome del database esterno: vedi db-schemas.
    extra_hosts:
      - "${DB_HOSTS_ENTRY:-host.docker.internal:host-gateway}"
    restart: unless-stopped

  db-init:
    image: postgres:${POSTGRES_VERSION:-15}
    container_name: ${COMPOSE_PROJECT_NAME}-db-init
    profiles: ["init"]
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
    volumes:
      - ./setup/db/init.sql:/scripts/init.sql
      - ${DB_CERTS_DIR:-./.certs}:/certs:ro
    networks:
      - app-network
    # Nome del database esterno: vedi db-schemas.
    extra_hosts:
      - "${DB_HOSTS_ENTRY:-host.docker.internal:host-gateway}"
    environment:
      PGPASSWORD: ${DB_PASSWORD:?}
      PGSSLMODE: ${DB_SSLMODE:-disable}
      PGSSLROOTCERT: ${DB_SSLROOTCERT:+/certs/root.crt}
      PGSSLCERT: ${DB_SSLCERT:+/certs/client.crt}
      PGSSLKEY: ${DB_SSLKEY:+/certs/client.key}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
    # Con un utente dedicato a Keycloak (KEYCLOAK_DB_USER) le sue tabelle sono
    # sue: init.sql gira come DB_USER e crea foreign key verso user_entity,
    # quindi prima il proprietario gli concede schema e REFERENCES. Nessun
    # admin del database coinvolto. Senza utente dedicato si salta, come prima.
    command:
      - sh
      - -c
      - |
        set -e
        if [ -n "$$KEYCLOAK_DB_USER" ] && [ "$$KEYCLOAK_DB_USER" != "${DB_USER:-euonqol_user}" ]; then
          PGPASSWORD="$$KEYCLOAK_DB_PASSWORD" psql -v ON_ERROR_STOP=1 -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "$$KEYCLOAK_DB_USER" -d "${DB_NAME:-euonqol}" \
            -c 'GRANT USAGE ON SCHEMA "${KEYCLOAK_DB_SCHEMA:-public}" TO "${DB_USER:-euonqol_user}";' \
            -c 'GRANT REFERENCES ON "${KEYCLOAK_DB_SCHEMA:-public}".user_entity TO "${DB_USER:-euonqol_user}";'
        fi
        exec psql -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "${DB_USER:-euonqol_user}" -d "${DB_NAME:-euonqol}" -v keycloak_schema="${KEYCLOAK_DB_SCHEMA:-public}" -f /scripts/init.sql
    restart: "no"

  keycloak-setup:
    image: curlimages/curl:latest
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak-setup
    # Era l'unico dei quattro compose a non avere il profilo init, mentre
    # db-init ce l'ha e dipende da lui: un `up` normale lo avviava comunque.
    profiles: ["init"]
    depends_on:
      - keycloak
    volumes:
      - ./setup/keycloak/init-keycloak.sh:/scripts/init.sh
    networks:
      - app-network
    environment:
      # Keycloak Configuration
      KEYCLOAK_URL: http://keycloak:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_URL_PUBLIC: ${KEYCLOAK_URL_PUBLIC:-http://localhost:${KEYCLOAK_PORT:-8080}}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Realm Configuration
      REALM_ID: ${KEYCLOAK_REALM_ID:?}
      REALM_NAME: euonqol
      FRONTEND_CLIENT_ID: ${KEYCLOAK_CLIENT_FRONTEND_ID:-euonqol-frontend}
      CREDENTIALS_CHECK_CLIENT_ID: ${KEYCLOAK_CLIENT_CREDENTIALS_CHECK_ID:-euonqol-credentials-check}
      BACKEND_CLIENT_ID: euonqol-backend
      BACKEND_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}

      # Test User Configuration
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME}
      ADMIN_TYPE: ${ADMIN_TYPE}
      ADMIN_IS_ACTIVE: ${ADMIN_IS_ACTIVE}

      # Mail Configuration
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@euonqol.com}
      EMAIL_FROM_DISPLAY_NAME: ${EMAIL_FROM_DISPLAY_NAME:-EUONQOL}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    # init-keycloak.sh aspetta Keycloak per un massimo di 3 minuti, che su un
    # database esterno non bastano (bootstrap Liquibase oltre i 5 minuti).
    # Qui si attende senza limite prima di cedere il controllo allo script.
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "In attesa di Keycloak..."
        WAITED=0
        until curl -sf -o /dev/null "http://keycloak:${KEYCLOAK_PORT:-8080}/realms/master"; do
          sleep 5
          WAITED=$$((WAITED + 5))
          echo "  ...ancora in bootstrap ($${WAITED}s). Avanzamento: docker logs -f ${COMPOSE_PROJECT_NAME}-keycloak"
        done
        echo "Keycloak raggiungibile, avvio init-keycloak.sh"
        exec /bin/sh /scripts/init.sh
    restart: "no"

  mailpit:
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    image: axllent/mailpit:latest
    ports:
      - "${EMAIL_PORT:-1025}:1025"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: docker/dockerfile
      # Proxy per npm, apk e Prisma durante la build: i valori li esporta il
      # Makefile solo se OUTBOUND_PROXY e' impostato, altrimenti non arrivano.
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - http_proxy
        - https_proxy
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}

      # Server
      PORT: ${BACKEND_PORT:-3000}
      FRONTEND_URL: ${FRONTEND_URL:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Proxy per le chiamate HTTPS in uscita (CAT, Teams). Vuoto = dirette.
      OUTBOUND_PROXY: ${OUTBOUND_PROXY:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-}

      # Database.
      #
      # DB_SSLMODE vale `disable` di default, perche' il postgres in
      # container non espone TLS. Per un database esterno va messo nell'env
      # file insieme agli eventuali certificati (DB_SSLROOTCERT, DB_SSLCERT,
      # DB_SSLKEY), che `make db-certs` prepara in /certs. Ogni client ha i
      # suoi parametri:
      #   - Prisma (le due URL) accetta solo disable/prefer/require: il
      #     Makefile passa verify-ca/verify-full come DB_SSLMODE_PRISMA=require
      #     e, con la CA, si aggiunge sslaccept=strict. Per Prisma `sslcert` e'
      #     la CA e `sslidentity` il certificato client in PKCS#12;
      #   - il driver `pg` (Pool di src/config/database.ts e
      #     scripts/migrate.ts) ignora i parametri SSL delle URL e usa
      #     DB_SSLMODE, DB_SSL_CA_FILE e DB_SSL_PFX_FILE: vedi src/config/dbSsl.ts.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-euonqol}
      DB_USER: ${DB_USER:-euonqol_user}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSL_CA_FILE: ${DB_SSLROOTCERT:+/certs/root.crt}
      DB_SSL_PFX_FILE: ${DB_SSLCERT:+/certs/client.p12}
      DB_SCHEMA: ${DB_SCHEMA:-euonqol}
      KEYCLOAK_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      APP_DATABASE_URL: postgresql://${DB_USER:-euonqol_user}:${DB_PASSWORD:?}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-euonqol}?schema=${DB_SCHEMA:-euonqol}&sslmode=${DB_SSLMODE_PRISMA:-${DB_SSLMODE:-disable}}${DB_SSLROOTCERT:+&sslcert=/certs/root.crt&sslaccept=strict}${DB_SSLCERT:+&sslidentity=/certs/client.p12}&connection_limit=${DB_CONNECTION_LIMIT:-10} # Client per l'app (schema euonqol)
      KEYCLOAK_DATABASE_URL: postgresql://${KEYCLOAK_DB_USER:-${DB_USER:-euonqol_user}}:${KEYCLOAK_DB_PASSWORD:-${DB_PASSWORD:?}}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-euonqol}?schema=${KEYCLOAK_DB_SCHEMA:-public}&sslmode=${DB_SSLMODE_PRISMA:-${DB_SSLMODE:-disable}}${DB_SSLROOTCERT:+&sslcert=/certs/root.crt&sslaccept=strict}${DB_SSLCERT:+&sslidentity=/certs/client.p12}&connection_limit=${KEYCLOAK_DB_CONNECTION_LIMIT:-5} # Client per Keycloak

      # Keycloak
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM_ID: ${KEYCLOAK_REALM_ID:?}
      KEYCLOAK_URL: http://keycloak:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM: euonqol
      KEYCLOAK_CLIENT_ID: euonqol-backend
      KEYCLOAK_CLIENT_CREDENTIALS_CHECK_ID: ${KEYCLOAK_CLIENT_CREDENTIALS_CHECK_ID:-euonqol-credentials-check}
      KEYCLOAK_CLIENT_FRONTEND_ID: ${KEYCLOAK_CLIENT_FRONTEND_ID:-euonqol-frontend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}

      # Email
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@euonqol.local}
      EMAIL_FROM_DISPLAY_NAME: ${EMAIL_FROM_DISPLAY_NAME:-EUONQOL}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}

      # CAT (Computer Adaptive Testing): read only on the first boot, see
      # .env.example
      CAT_API_URL: ${CAT_API_URL:-}
      CAT_API_KEY: ${CAT_API_KEY:-}
      # Institute shown in Settings > Institute: read only on the first boot, to
      # create it (name, address, city and country are all needed for that).
      INSTITUTE_NAME: ${INSTITUTE_NAME:-}
      INSTITUTE_ADDRESS: ${INSTITUTE_ADDRESS:-}
      INSTITUTE_CITY: ${INSTITUTE_CITY:-}
      INSTITUTE_COUNTRY: ${INSTITUTE_COUNTRY:-}
      INSTITUTE_REFERENT_NAME: ${INSTITUTE_REFERENT_NAME:-}
      INSTITUTE_EMAIL: ${INSTITUTE_EMAIL:-}
      INSTITUTE_PHONE: ${INSTITUTE_PHONE:-}

      # Altre
      NODE_ENV: ${NODE_ENV}

      # Notifiche errori su Teams
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_NOTIFICATIONS_ENABLED: ${TEAMS_NOTIFICATIONS_ENABLED:-true}
      TEAMS_NOTIFY_MIN_STATUS: ${TEAMS_NOTIFY_MIN_STATUS:-500}
      TEAMS_NOTIFY_THROTTLE_MS: ${TEAMS_NOTIFY_THROTTLE_MS:-300000}

      # Scheduler
      ENABLE_SCHEDULER: "true"
    volumes:
      # Nessun bind mount del codice (come in staging): codice, node_modules e
      # client Prisma arrivano dall'immagine, quindi ogni `make deploy` li
      # aggiorna. I PDF caricati restano su un volume con nome.
      - ${DB_CERTS_DIR:-./.certs}:/certs:ro
      - backend-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      keycloak-setup:
        condition: service_completed_successfully
        # keycloak-setup e' ora dietro il profilo `init`, quindi assente da un
        # `up` normale.
        required: false
    networks:
      - app-network
    # Nome del database esterno: vedi db-schemas.
    extra_hosts:
      - "${DB_HOSTS_ENTRY:-host.docker.internal:host-gateway}"

  frontend:
    build:
      context: ./frontend-shadcn
      dockerfile: docker/dockerfile
      # Proxy per npm, apk e Prisma durante la build: i valori li esporta il
      # Makefile solo se OUTBOUND_PROXY e' impostato, altrimenti non arrivano.
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - http_proxy
        - https_proxy
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # HTTPS: con FRONTEND_TLS=on il Makefile pubblica qui FRONTEND_HTTPS_PORT.
      # Spento, la 443 del container va su una porta effimera di 127.0.0.1:
      # nessuna porta dell'host occupata, quindi nessun conflitto sulla 443.
      - "${FRONTEND_HTTPS_PUBLISH:-127.0.0.1::443}"
    environment:
      FRONTEND_TLS: ${FRONTEND_TLS:-off}
      FRONTEND_HTTPS_PORT: ${FRONTEND_HTTPS_PORT:-443}
    volumes:
      # Log giornaliero dei tentativi bloccati da nginx (403/405), retention 7 giorni
      # gestita da crond dentro il container (vedi frontend-shadcn/docker/log-cleanup.crontab)
      - ./logs/nginx:/var/log/nginx/blocked
      # Certificato e chiave HTTPS, preparati da `make web-certs`
      - ${WEB_CERTS_DIR:-./.certs/prod-web}:/etc/nginx/tls:ro
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  backend-uploads:
    name: ${COMPOSE_PROJECT_NAME}-backend-uploads
  postgres-test-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME}-network
    driver: bridge
